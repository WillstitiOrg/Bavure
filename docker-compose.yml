services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.labavure.rule=Host(`labavure-dargos.willstiti.fr`)"
      - "traefik.http.routers.labavure.entrypoints=websecure"
      - "traefik.http.routers.labavure.tls.certresolver=letsencrypt"
      - "traefik.http.services.labavure.loadbalancer.server.port=80"
    networks:
      - web
    volumes:
      - ./uploads:/uploads
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.labavure-api.rule=Host(`labavure-dargos.willstiti.fr`) && PathPrefix(`/api`)"
      - "traefik.http.routers.labavure-api.entrypoints=websecure"
      - "traefik.http.routers.labavure-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.labavure-api.loadbalancer.server.port=3001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./uploads:/uploads
    networks:
      - web
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - web

volumes:
  pgdata:

networks:
  web:
    external: true